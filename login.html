<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokéShop - Entrar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="index.html">PokéShop</a></div></nav>
<main class="container">
  <form class="auth-card" id="form-login">
    <h1 class="h3 mb-4">Iniciar sesión</h1>
    <div class="mb-3"><label class="form-label" for="email">Correo</label><input class="form-control" id="email" type="email" required></div>
    <div class="mb-3"><label class="form-label" for="pass">Contraseña</label><input class="form-control" id="pass" type="password" required></div>
    <button class="btn btn-primary w-100" type="submit">Entrar</button>
    <p class="mt-3 mb-0 text-center">¿Sin cuenta? <a href="registro.html">Regístrate</a></p>
  </form>
</main>

<div class="modal fade" id="modalOk" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">¡Bienvenido!</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body">Has iniciado sesión correctamente.</div>
    <div class="modal-footer"><a class="btn btn-primary" href="index.html">Ir al inicio</a></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('form-login').addEventListener('submit', e => {
    e.preventDefault();
    new bootstrap.Modal('#modalOk').show();
  });
</script>
</body>
</html>
