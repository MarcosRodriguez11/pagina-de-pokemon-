<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokéShop - Registro</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="index.html">PokéShop</a></div></nav>
<main class="container">
  <form class="auth-card" id="form-registro">
    <h1 class="h3 mb-4">Crear cuenta</h1>
    <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" required></div>
    <div class="mb-3"><label class="form-label" for="email">Correo</label><input class="form-control" id="email" type="email" required></div>
    <div class="row">
      <div class="col-md-6 mb-3"><label class="form-label" for="pass">Contraseña</label><input class="form-control" id="pass" type="password" minlength="6" required></div>
      <div class="col-md-6 mb-3"><label class="form-label" for="pass2">Repetir</label><input class="form-control" id="pass2" type="password" minlength="6" required></div>
    </div>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="terminos" required><label class="form-check-label" for="terminos">Acepto los términos</label></div>
    <button class="btn btn-primary w-100" type="submit">Registrarme</button>
    <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a href="login.html">Entra</a></p>
  </form>
</main>

<div class="modal fade" id="modalOk" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Registro completado</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body">Tu cuenta se ha creado. Ya puedes iniciar sesión.</div>
    <div class="modal-footer"><a class="btn btn-primary" href="login.html">Iniciar sesión</a></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('form-registro').addEventListener('submit', e => {
    e.preventDefault();
    if (pass.value !== pass2.value) { pass2.setCustomValidity('No coinciden'); pass2.reportValidity(); return; }
    pass2.setCustomValidity('');
    new bootstrap.Modal('#modalOk').show();
  });
</script>
</body>
</html>
