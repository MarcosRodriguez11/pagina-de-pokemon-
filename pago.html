<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokéShop - Pago</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="index.html">PokéShop</a></div></nav>
<main class="container py-5">
  <h1 class="section-title">Finalizar compra</h1>
  <div class="row g-5">
    <div class="col-lg-5 order-lg-2">
      <div class="checkout-summary">
        <h2 class="h5">Tu pedido</h2>
        <ul class="list-group list-group-flush mb-3">
          <li class="list-group-item d-flex justify-content-between"><span>Peluche Pikachu</span><strong>24,99 €</strong></li>
          <li class="list-group-item d-flex justify-content-between"><span>Envío</span><strong>3,00 €</strong></li>
          <li class="list-group-item d-flex justify-content-between"><span>Total</span><strong>27,99 €</strong></li>
        </ul>
      </div>
    </div>
    <div class="col-lg-7">
      <form id="form-pago">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label" for="n">Nombre</label><input class="form-control" id="n" required></div>
          <div class="col-md-6"><label class="form-label" for="a">Dirección</label><input class="form-control" id="a" required></div>
          <div class="col-12"><label class="form-label" for="t">Tarjeta</label><input class="form-control" id="t" inputmode="numeric" placeholder="0000 0000 0000 0000" required></div>
          <div class="col-6"><label class="form-label" for="c">Caducidad</label><input class="form-control" id="c" placeholder="MM/AA" required></div>
          <div class="col-6"><label class="form-label" for="v">CVV</label><input class="form-control" id="v" required></div>
        </div>
        <button class="btn btn-primary btn-lg btn-brillo w-100 mt-4" type="submit">Pagar</button>
      </form>
    </div>
  </div>
</main>

<div class="modal fade" id="modalOk" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">¡Compra realizada!</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body">Gracias por tu compra. Te enviaremos un correo con el pedido.</div>
    <div class="modal-footer"><a class="btn btn-primary" href="index.html">Volver al inicio</a></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('form-pago').addEventListener('submit', e => {
    e.preventDefault();
    new bootstrap.Modal('#modalOk').show();
  });
</script>
</body>
</html>
