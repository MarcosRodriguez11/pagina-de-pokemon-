<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokéShop - Inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">PokéShop</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Menú"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="tienda.html">Novedades</a></li>
        <li class="nav-item"><a class="nav-link" href="pago.html">Carrito <span class="badge text-bg-secondary badge-count">1</span></a></li>
      </ul>
      <a class="btn btn-outline-light me-2" href="login.html">Entrar</a>
      <a class="btn btn-primary" href="registro.html">Registro</a>
    </div>
  </div>
</nav>

<main>
  <header class="hero text-center">
    <div class="container">
      <h1 class="display-4 fw-bold">Atrápalos todos</h1>
      <p class="lead">Videojuegos, cartas y peluches Pokémon recién llegados.</p>
      <a class="btn btn-secondary btn-lg" href="tienda.html">Ver novedades</a>
    </div>
  </header>

  <section class="container my-5">
    <div id="carrusel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner rounded-4 shadow">
        <div class="carousel-item active"><img src="img/mewtwo.png" class="d-block w-100" alt="Nueva edición"></div>
        <div class="carousel-item"><img src="img/charizard.png" class="d-block w-100" alt="Cartas con 20% de descuento"></div>
        <div class="carousel-item"><img src="img/eevee.png" class="d-block w-100" alt="Envío gratis"></div>
      </div>
      <button class="carousel-control-prev" data-bs-target="#carrusel" data-bs-slide="prev" aria-label="Anterior"><span class="carousel-control-prev-icon"></span></button>
      <button class="carousel-control-next" data-bs-target="#carrusel" data-bs-slide="next" aria-label="Siguiente"><span class="carousel-control-next-icon"></span></button>
    </div>
  </section>

  <section class="container my-5">
    <h2 class="section-title text-center">Productos estrella</h2>
    <div class="slider" aria-label="Productos estrella">
      <div class="slides">
        <figure><img src="img/pikachu.png" alt="Peluche Pikachu"><figcaption>Peluche Pikachu</figcaption></figure>
        <figure><img src="img/charizard.png" alt="Cartas Charizard"><figcaption>Cartas Charizard</figcaption></figure>
        <figure><img src="img/mewtwo.png" alt="Juego Mewtwo"><figcaption>Juego Mewtwo</figcaption></figure>
        <figure><img src="img/eevee.png" alt="Peluche Eevee"><figcaption>Peluche Eevee</figcaption></figure>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer py-4 mt-5">
  <div class="container d-flex flex-wrap justify-content-between">
    <span>&copy; 2026 PokéShop</span>
    <span><a href="tienda.html">Novedades</a> · <a href="login.html">Entrar</a></span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
