<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokéShop - Producto</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="index.html">PokéShop</a><a class="btn btn-outline-light" href="tienda.html">Volver</a></div></nav>
<main class="container py-5">
  <div class="row g-5">
    <div class="col-md-6"><img class="rounded-4 shadow" src="img/pikachu.png" alt="Peluche Pikachu"></div>
    <div class="col-md-6">
      <span class="badge text-bg-secondary mb-2">Nuevo</span>
      <h1>Peluche Pikachu</h1>
      <p class="fs-3 text-primary fw-bold">24,99 €</p>
      <p>Peluche oficial de Pikachu, suave y de 30 cm. Perfecto para coleccionistas.</p>
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#carac">Características</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#envio">Envío</button></li>
      </ul>
      <div class="tab-content mb-4">
        <div class="tab-pane fade show active" id="carac">Tamaño 30 cm, tela suave, producto oficial.</div>
        <div class="tab-pane fade" id="envio">Envío en 24-48 horas.</div>
      </div>
      <a class="btn btn-primary btn-lg" href="pago.html">Comprar</a>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
