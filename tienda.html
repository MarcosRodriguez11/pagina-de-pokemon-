<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokéShop - Novedades</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="index.html">PokéShop</a><a class="btn btn-outline-light" href="pago.html">Carrito</a></div></nav>
<main class="container py-5">
  <h1 class="section-title">Novedades Pokémon</h1>
  <div class="row g-4">
    <div class="col-sm-6 col-lg-4">
      <div class="card product-card h-100 shadow-sm">
        <img src="img/pikachu.png" class="card-img-top" alt="Peluche Pikachu">
        <div class="card-body">
          <span class="badge text-bg-secondary mb-2">Nuevo</span>
          <h2 class="h5 card-title">Peluche Pikachu</h2>
          <p class="price">24,99 €</p>
          <a href="producto.html" class="btn btn-primary">Ver detalles</a>
        </div>
      </div>
    </div>
    <div class="col-sm-6 col-lg-4">
      <div class="card product-card h-100 shadow-sm">
        <img src="img/charizard.png" class="card-img-top" alt="Sobre de cartas Pokémon">
        <div class="card-body">
          <span class="badge text-bg-warning mb-2">Oferta</span>
          <h2 class="h5 card-title">Sobre de cartas Pokémon</h2>
          <p class="price">4,99 €</p>
          <a href="producto.html" class="btn btn-primary">Ver detalles</a>
        </div>
      </div>
    </div>
    <div class="col-sm-6 col-lg-4">
      <div class="card product-card h-100 shadow-sm">
        <img src="img/mewtwo.png" class="card-img-top" alt="Juego Pokémon Escarlata">
        <div class="card-body">
          <span class="badge text-bg-secondary mb-2">Nuevo</span>
          <h2 class="h5 card-title">Juego Pokémon Escarlata</h2>
          <p class="price">59,99 €</p>
          <a href="producto.html" class="btn btn-primary">Ver detalles</a>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
